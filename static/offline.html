<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf8f5" />
    <title>Kame Lends</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #faf8f5;
        --ink: #2a1d12;
        --muted: rgba(42, 29, 18, 0.66);
        --accent: #fb9f44;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-96.png" alt="" />
      <h1>You're offline</h1>
      <p>Open a page you visited before, or retry when you're back online.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
