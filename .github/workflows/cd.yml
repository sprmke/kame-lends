name: CD

# Production continuous delivery for main.
# Order: quality → migrate → deploy (never deploy schema-breaking code before SQL lands).
#
# Required GitHub Environment secrets on environment "production":
#   DATABASE_URL       — same Neon connection string as Vercel Production
#   VERCEL_TOKEN       — https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — from `vercel link` / project settings
#   VERCEL_PROJECT_ID  — from `vercel link` / project settings
#
# Optional:
#   PRODUCTION_URL     — defaults to https://pawn-tracker.vercel.app (post-deploy smoke test)
#
# Turn off competing Git Production deploys: vercel.json ignoreCommand skips main
# production builds; this workflow is the only Production release path.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (svelte-check)
        run: bun run check
      - name: Format (Prettier)
        run: bun run format:check
      - name: Lint (ESLint)
        run: bun run lint:js
      - name: Unit tests
        run: bun run test:unit
      - name: AI tooling sync
        run: bun run check:ai-tooling-sync
      - name: Build
        run: bun run build
      - name: Precache budget
        run: node scripts/pwa/check-precache-budget.mjs
      - name: Dependency audit
        run: bun audit --audit-level=high

  migrate:
    name: Migrate
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/db/migrate-pending.sh --yes
      - name: Verify migrations applied
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/db/check-migrations-pending.sh

  deploy:
    name: Deploy
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bash scripts/deploy/vercel-prod.sh
      - name: Smoke test production health
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://pawn-tracker.vercel.app}"
          echo "GET ${BASE}/api/health"
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS "${BASE}/api/health" || true)"
            if echo "$body" | grep -q '"ok":true'; then
              echo "$body"
              exit 0
            fi
            echo "Attempt ${attempt}/5 not ready yet: ${body:-curl failed}"
            sleep 15
          done
          echo "::error title=Production smoke test failed::${BASE}/api/health did not return ok:true. DB migrations may be missing or deploy is unhealthy."
          exit 1
      - name: Smoke public shell
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://pawn-tracker.vercel.app}"
          curl -fsS -o /dev/null -w "%{http_code}" "${BASE}/signin" | grep -qE '200|304'
          curl -fsS "${BASE}/api/pwa/version" | grep -q 'version\|disabled'
          code="$(curl -s -o /dev/null -w "%{http_code}" -X POST "${BASE}/api/e2e/session")"
          test "$code" = "404"
          headers="$(curl -sI "${BASE}/signin")"
          echo "$headers" | grep -qi "x-content-type-options: nosniff"
          echo "$headers" | grep -qi "strict-transport-security"

  notify-failure:
    name: Notify on failure
    needs: [quality, migrate, deploy]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update CD alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const results = {
              quality: '${{ needs.quality.result }}',
              migrate: '${{ needs.migrate.result }}',
              deploy: '${{ needs.deploy.result }}'
            };
            const failed = Object.entries(results)
              .filter(([, result]) => result === 'failure')
              .map(([name]) => name);
            const title = 'Production CD failed';
            const body = [
              `Workflow [${context.runId}](${runUrl}) failed on \`${context.sha.substring(0, 7)}\`.`,
              '',
              '**Failed jobs:** ' + (failed.length ? failed.join(', ') : 'see run'),
              '',
              'Production may be on stale code, missing migrations, or an unhealthy deploy.',
              'Check Actions → CD, then run `bun run db:migrate:pending:vercel --yes` if SQL is behind.',
              '',
              `_Auto-opened by CD notify-failure._`
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cd-failure',
              per_page: 1
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cd-failure']
              });
            }
      - name: Annotate workflow summary
        run: |
          echo "::error title=Production CD failed::See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} — quality, migrate, or deploy did not finish."
