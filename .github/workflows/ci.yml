name: CI

on:
  push:
    branches: [main, feat/sveltekit-migration]
  pull_request:

jobs:
  sveltekit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check
      - run: bun run test
      - run: bun run build
