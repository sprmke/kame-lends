name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (svelte-check)
        run: bun run check
      - name: Format (Prettier)
        run: bun run format:check
      - name: Lint (ESLint)
        run: bun run lint:js
      - name: Unit tests
        run: bun run test:unit
      - name: Coverage gate (money engine)
        run: bun run test:coverage
      - name: AI tooling sync
        run: bun run check:ai-tooling-sync
      - name: AI gateway guard
        run: bun run check:ai-gateway
      - name: AI tools guard (read-only)
        run: bun run check:ai-tools
      - name: Build
        run: bun run build
      - name: Precache budget
        run: node scripts/pwa/check-precache-budget.mjs
      - name: Dependency audit
        # braces@3.0.3 via lint-staged has no patched release (GHSA-vfj7-8cjw-p6xm).
        # @sveltejs/kit 2.x has no patch for GHSA-3r8g-jcqq-3p5j (fixed in 3.1.1 only).
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm --ignore GHSA-3r8g-jcqq-3p5j

  lighthouse:
    name: Lighthouse (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kame_lends
          POSTGRES_PASSWORD: kame_lends
          POSTGRES_DB: kame_lends
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kame_lends"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kame_lends:kame_lends@127.0.0.1:5433/kame_lends
      E2E_AUTH_SECRET: lighthouse-local-secret
      E2E_USER_EMAIL: e2e@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun run db:migrate:pending --yes
      - name: Seed
        run: bun scripts/db/seed-e2e.ts
      - name: Lighthouse
        run: bun run perf:lighthouse

  e2e-money:
    name: E2E money
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kame_lends
          POSTGRES_PASSWORD: kame_lends
          POSTGRES_DB: kame_lends
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kame_lends"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kame_lends:kame_lends@127.0.0.1:5433/kame_lends
      E2E_AUTH_SECRET: e2e-ci-secret
      E2E_USER_EMAIL: e2e@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun run db:migrate:pending --yes
      - name: Seed
        run: bun scripts/db/seed-e2e.ts
      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium
      - name: Money and accessibility journeys
        run: bun run test:e2e -- --project=setup --project=money-flows --project=a11y
      - name: Money health authorization
        run: bun run test:e2e -- --project=setup --project=multi-role -g "money health"
      - name: Loan create journey
        run: bun run test:e2e -- --project=setup --project=crud-flows -g "create and delete a loan"

  integration:
    name: DB integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kame_lends
          POSTGRES_PASSWORD: kame_lends
          POSTGRES_DB: kame_lends
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kame_lends"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kame_lends:kame_lends@127.0.0.1:5433/kame_lends
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun run db:migrate:pending --yes
      - name: Integration tests
        run: bun run test:integration
      - name: Timezone matrix
        run: bun run test:unit:tz

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium
      - name: Smoke
        run: bun run test:e2e -- --project=smoke

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: bun x commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
