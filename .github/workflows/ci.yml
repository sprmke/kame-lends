name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (svelte-check)
        run: bun run check
      - name: Format (Prettier)
        run: bun run format:check
      - name: Lint (ESLint)
        run: bun run lint:js
      - name: Unit tests
        run: bun run test:unit
      - name: AI tooling sync
        run: bun run check:ai-tooling-sync
      - name: AI gateway guard
        run: bun run check:ai-gateway
      - name: Build
        run: bun run build
      - name: Precache budget
        run: node scripts/pwa/check-precache-budget.mjs
      - name: Dependency audit
        # braces@3.0.3 via lint-staged has no patched release (GHSA-vfj7-8cjw-p6xm).
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm

  e2e-smoke:
    name: E2E smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium
      - name: Smoke
        run: bun run test:e2e -- --project=smoke

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: bun x commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
